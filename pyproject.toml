[project]
name = "consensus-lab"
version = "1.0.0"
description = "Proof of work, Casper FFG and an asyncio gossip network (OE Blockchain Lab 03, student implementation)"
readme = "README.md"
requires-python = ">=3.11"
# Standard library only: hashlib, struct, asyncio, multiprocessing, statistics, random.
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
